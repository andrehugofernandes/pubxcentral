name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check types
      run: npm run type-check || npm run tsc
    
    - name: Lint
      run: npm run lint || npm run eslint
    
    - name: Build
      run: npm run build
    
    - name: Test
      run: npm test || echo "No tests specified"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to production
      run: echo "Deploy to production would happen here"
      # Aqui você pode adicionar os passos para deploy em produção
      # Por exemplo, deploy para Vercel, AWS, etc. 